services:
  collector:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./runs:/app/runs
    command: ["whytrace", "serve", "--host", "0.0.0.0", "--port", "8080"]

  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./runs:/app/runs
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--", "runs/demo"]
    depends_on:
      - collector

